--ink);transition:.18s}.start-link:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}.micro{font-size:10px;line-height:1.55;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.marquee-shell{overflow:hidden;border-block:1.5px solid var(--ink);background:var(--paper);padding:16px 0}.marquee{display:flex;width:max-content;gap:15px;animation:marquee 30s linear infinite}.shot{width:270px;height:180px;margin:0;flex:none;border:1.5px solid var(--ink);border-radius:24px;overflow:hidden;position:relative;box-shadow:6px 6px 0 rgba(17,17,17,.11);transform:rotate(var(--r))}.shot img{width:100%;height:100%;object-fit:cover;display:block}.shot:after{content:attr(data-label);position:absolute;left:10px;bottom:10px;border:1px solid var(--ink);border-radius:999px;background:var(--yellow);padding:6px 9px;font-size:10px;font-weight:900}.manifesto{padding:100px 26px 120px}.manifesto-grid{max-width:1380px;margin:auto;display:grid;grid-template-columns:.7fr 1.3fr;gap:8vw}.label{font-size:10px;letter-spacing:.16em;text-transform:uppercase}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.pill{border:1px solid var(--ink);background:var(--paper);border-radius:999px;padding:9px 12px;font-size:11px}.copy{font-size:clamp(38px,5.8vw,82px);line-height:.98;letter-spacing:-.06em;font-weight:800}.copy mark{background:var(--pink);color:var(--ink);padding:0 .08em}@keyframes marquee{to{transform:translateX(-50%)}}@keyframes float{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(20px,-25px,0) rotate(8deg)}}@media(max-width:760px){.nav{padding:0 15px}.nav-meta{display:none}.hero{padding:92px 16px 18px}.hero-top{display:block}.hero-title{font-size:clamp(60px,22vw,105px);margin-top:10vh}.hero-bottom{display:block}.micro{margin-top:15px}.blob.a{width:150px;height:150px}.blob.b{width:120px;height:120px}.shot{width:215px;height:145px}.manifesto{padding:80px 16px}.manifesto-grid{grid-template-columns:1fr;gap:28px}}
</style>
