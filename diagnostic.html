<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KIMKIM — Work Pattern Scan</title>
<style>
:root{--bg:#f8f6ef;--paper:#fffdf8;--ink:#111;--muted:#6d6a64;--line:#cbc6ba;--lime:#dfff4f;--blue:#4d67ff;--pink:#ff7ac8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fffdf8,#eef0ff);color:var(--ink);font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.nav{height:62px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(17,17,17,.1);background:rgba(248,246,239,.9);position:sticky;top:0;z-index:10}.logo{font-size:22px;font-weight:900;letter-spacing:-.07em}.back{color:var(--ink);text-decoration:none;font-size:12px;font-weight:800}.wrap{max-width:1120px;margin:auto;padding:34px 20px 70px}.top{display:grid;grid-template-columns:120px 1fr 80px;gap:18px;align-items:center;margin-bottom:28px}.track{height:6px;background:white;border:1.5px solid var(--ink);overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--blue);transition:.25s}.counter{text-align:right;font-size:12px}.status{display:inline-flex;margin:0 0 18px;padding:7px 10px;border:1px solid var(--ink);border-radius:999px;background:#ffd7d7;font-size:10px;font-weight:900;letter-spacing:.12em}.status.ready{background:var(--lime)}.panel{min-height:72vh;display:flex;flex-direction:column;justify-content:center}.kicker{font-size:11px;letter-spacing:.16em;color:var(--blue);font-weight:900;margin-bottom:18px}.q{font-size:clamp(38px,6vw,76px);line-height:1.03;letter-spacing:-.055em;margin:0 0 34px;max-width:930px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:116px;border:1.5px solid var(--ink);border-radius:24px;background:var(--paper);padding:22px;text-align:left;cursor:pointer;box-shadow:5px 5px 0 rgba(17,17,17,.13);transition:.16s}.option:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--blue)}.option span{display:block;font-size:10px;color:var(--muted);margin-bottom:20px}.option b{font-size:17px;line-height:1.5}.result{display:none;padding-top:30px}.result h1{font-size:clamp(60px,10vw,140px);line-height:.84;letter-spacing:-.08em;margin:18px 0 28px}.result h1 small{display:block;font-size:.22em;margin-top:18px}.desc{font-size:clamp(18px,2vw,26px);line-height:1.55;max-width:820px;color:#403d39}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:42px}.card{border:1.5px solid var(--ink);border-radius:28px;padding:26px;min-height:330px;box-shadow:7px 7px 0 rgba(17,17,17,.12)}.dark{background:#111;color:#fff}.lime{background:var(--lime)}.label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;opacity:.6;margin-bottom:24px}.bar-row{margin:18px 0}.bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.bar{height:12px;background:#303030;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pink);border-radius:999px}.action{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:17px 0;border-top:1px solid rgba(17,17,17,.16)}.action:first-child{border-top:0}.action p{margin:7px 0 0;line-height:1.55}.actions{display:flex;gap:10px;margin-top:22px}.btn{border:1.5px solid var(--ink);border-radius:999px;padding:14px 18px;font-weight:900;text-decoration:none;color:#fff;background:var(--blue);cursor:pointer}.btn.alt{background:var(--paper);color:var(--ink)}@media(max-width:760px){.top{grid-template-columns:75px 1fr 55px}.options,.grid{grid-template-columns:1fr}.wrap{padding:24px 14px 50px}.actions{flex-direction:column}}
</style>
</head>
<body>
<nav class="nav"><div class="logo">KIMKIM®</div><a class="back" href="./index.html">← HOME</a></nav>
<main class="wrap">
<section id="quiz">
<div class="top"><div class="logo">SCAN</div><div class="track"><i id="progress"></i></div><div class="counter" id="count">1 / 12</div></div>
<div id="jsStatus" class="status">JS CHECK...</div>
<div class="panel"><div class="kicker" id="kicker">QUESTION 01</div><h1 class="q" id="question">새 업무가 도착했습니다. 첫 반응은?</h1><div class="options" id="options"><button type="button" class="option"><span>01</span><b>진단 엔진 연결 중...</b></button></div></div>
</section>
<section class="result" id="result"><div class="label">YOUR DOMINANT WORK PATTERN</div><h1 id="resultTitle"></h1><p class="desc" id="resultDesc"></p><div class="grid"><div class="card dark"><div class="label">PATTERN DISTRIBUTION</div><div id="bars"></div></div><div class="card lime"><div class="label">7-DAY MICRO ACTIONS</div><div id="actions"></div></div></div><div class="actions"><button class="btn" type="button" id="restartBtn">다시 스캔하기</button><a class="btn alt" href="./index.html">홈으로</a></div></section>
<noscript><p style="padding:18px;border:2px solid #111;background:#ffb4b4;font-weight:800">현재 브라우저에서 JavaScript가 꺼져 있습니다. 이 진단은 JavaScript가 켜진 브라우저에서 실행됩니다.</p></noscript>
</main>
<script src="./diagnostic.js?v=20260820-1"></script>
</body>
</html>
