<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KIMKIM — 업무 패턴 진단</title>
<style>
:root{--bg:#07090f;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--text:#f7f8fb;--muted:#aeb5c5;--accent:#8b5cf6;--accent2:#22d3ee}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 10%,rgba(139,92,246,.25),transparent 30%),radial-gradient(circle at 85% 20%,rgba(34,211,238,.16),transparent 28%),var(--bg);color:var(--text);font-family:Inter,Pretendard,system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent 85%);pointer-events:none}.orb{position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(80px);opacity:.22;pointer-events:none;transition:transform .2s ease}.orb.a{background:#7c3aed;left:-120px;top:-120px}.orb.b{background:#06b6d4;right:-140px;bottom:-140px}
.wrap{width:min(1080px,calc(100% - 32px));margin:auto}.hero{min-height:100vh;display:grid;place-items:center;position:relative}.hero-inner{text-align:center;max-width:850px}.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);font-size:13px;color:#d8dbea;backdrop-filter:blur(12px)}h1{font-size:clamp(48px,8vw,104px);line-height:.95;letter-spacing:-.065em;margin:24px 0 22px}.grad{background:linear-gradient(90deg,#fff 5%,#b7a1ff 48%,#66e5f2);-webkit-background-clip:text;color:transparent}.sub{font-size:clamp(17px,2vw,22px);line-height:1.7;color:var(--muted);max-width:700px;margin:0 auto 34px}.btn{border:0;border-radius:16px;padding:16px 22px;font-size:16px;font-weight:800;cursor:pointer;color:#0a0c12;background:#fff;transition:.2s;box-shadow:0 10px 40px rgba(255,255,255,.08)}.btn:hover{transform:translateY(-2px) scale(1.01)}.btn.secondary{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line);box-shadow:none}.chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}.chip{font-size:13px;color:var(--muted);padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035)}
.test{display:none;min-height:100vh;padding:80px 0}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;color:var(--muted);font-size:14px}.progress{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:48px}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.35s}.question{animation:rise .45s ease}.qno{font-size:13px;color:#a78bfa;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.question h2{font-size:clamp(32px,5vw,56px);letter-spacing:-.045em;line-height:1.15;margin:14px 0 32px;max-width:820px}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{padding:22px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:#fff;text-align:left;font-size:16px;line-height:1.5;cursor:pointer;backdrop-filter:blur(16px);transition:.2s}.option:hover{transform:translateY(-3px);border-color:rgba(167,139,250,.55);background:rgba(255,255,255,.1)}
.result{display:none;padding:88px 0 120px}.result-head{margin-bottom:30px}.result h2{font-size:clamp(42px,7vw,82px);letter-spacing:-.06em;line-height:1;margin:8px 0 18px}.lead{font-size:18px;line-height:1.8;color:var(--muted);max-width:740px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:34px}.panel{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:26px;padding:26px;backdrop-filter:blur(20px)}.panel h3{margin:0 0 18px;font-size:18px}.bar-row{margin:18px 0}.bar-meta{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:1s cubic-bezier(.2,.8,.2,1)}.action{display:flex;gap:12px;padding:15px 0;border-top:1px solid var(--line)}.action:first-of-type{border-top:0}.num{min-width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(139,92,246,.18);color:#c4b5fd;font-weight:900}.action strong{display:block;margin-bottom:5px}.action p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}.footer-actions{display:flex;gap:10px;margin-top:24px}.tiny{font-size:12px;color:#7e8799;margin-top:26px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:760px){.options,.grid{grid-template-columns:1fr}.hero{min-height:92vh}.test{padding-top:44px}.panel{padding:21px}.footer-actions{flex-direction:column}}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<main>
<section class="hero" id="hero"><div class="wrap hero-inner"><div class="eyebrow">✦ KIMKIM WORK PATTERN LAB</div><h1>나는 일을<br><span class="grad">어떻게 움직이는 사람일까?</span></h1><p class="sub">12개의 짧은 선택으로 나의 업무 패턴을 살펴보고, 강점·주의할 습관·이번 주 바로 실행할 행동까지 확인해보세요.</p><button class="btn" onclick="startTest()">진단 시작하기 →</button><div class="chips"><span class="chip">약 2분</span><span class="chip">회원가입 없음</span><span class="chip">데이터 저장 없음</span></div></div></section>
<section class="test" id="test"><div class="wrap"><div class="topbar"><span>KIMKIM</span><span id="count">1 / 12</span></div><div class="progress"><i id="progress"></i></div><div id="questionBox"></div></div></section>
<section class="result" id="result"><div class="wrap"><div class="result-head"><div class="qno">YOUR WORK PATTERN</div><h2 id="resultTitle"></h2><p class="lead" id="resultDesc"></p></div><div class="grid"><div class="panel"><h3>업무 패턴 스코어</h3><div id="bars"></div></div><div class="panel"><h3>이번 주 실행 플랜</h3><div id="actions"></div></div></div><div class="footer-actions"><button class="btn" onclick="restart()">다시 진단하기</button><button class="btn secondary" onclick="copyResult()">결과 요약 복사</button></div><div class="tiny">이 결과는 자기이해를 위한 간단한 업무 패턴 진단이며 전문 심리검사가 아닙니다.</div></div></section>
</main>
<script>
const types={
execute:{name:'즉시 실행형',desc:'빠르게 시작하고 움직이면서 답을 찾는 힘이 큽니다. 속도와 추진력은 강점이지만, 시작 전 우선순위를 한 번만 더 확인하면 결과의 밀도가 더 높아집니다.'},actions:['시작 전 3분 동안 “이 일의 완료 기준”을 한 줄로 적기','오늘 가장 중요한 일 1개를 먼저 끝내고 다음 일로 이동하기','빠르게 만든 초안을 1명에게 먼저 공유해 조기 피드백 받기']},
plan:{name:'계획 설계형',desc:'일의 구조와 순서를 명확하게 잡을 때 최고의 성과를 냅니다. 복잡한 과제를 정리하는 데 강하지만, 준비가 길어질 때는 작은 초안을 먼저 만드는 것이 도움이 됩니다.'},actions:['계획 시간이 20분을 넘으면 바로 첫 초안 만들기','업무 시작 시 해야 할 일보다 “하지 않을 일” 1개 정하기','완성도 60% 상태에서 중간 공유 한 번 하기']},
quality:{name:'완성도 집중형',desc:'디테일과 기준에 민감하고 결과물의 품질을 높이는 데 강합니다. 다만 모든 일에 같은 수준의 완성도를 요구하면 에너지가 빠르게 소진될 수 있습니다.'},actions:['업무마다 A/B/C 완성도 등급을 먼저 정하기','수정 횟수를 최대 2회로 제한하는 업무 하나 정하기','퇴근 전 오늘 충분히 잘한 일 1개를 기록하기']},
people:{name:'관계 조율형',desc:'사람의 반응과 협업의 흐름을 빠르게 읽습니다. 관계를 매끄럽게 만드는 힘이 크지만, 타인의 기대를 지나치게 고려하면 내 우선순위가 흐려질 수 있습니다.'},actions:['요청을 받으면 즉답 대신 우선순위를 확인한 뒤 답하기','회의에서 내 의견을 첫 10분 안에 한 번 말하기','도움을 주기 전 “지금 내가 해야 할 핵심 업무”를 먼저 확인하기']}
};
const Q=[
['새로운 업무를 받았을 때 가장 먼저 하는 행동은?',[['일단 손부터 댄다','execute'],['전체 구조와 순서를 잡는다','plan'],['좋은 결과의 기준부터 확인한다','quality'],['관련된 사람들의 기대를 파악한다','people']]],
['마감이 촉박할 때 나는?',[['빠르게 결과를 만들고 수정한다','execute'],['남은 시간을 쪼개 계획한다','plan'],['핵심 품질만큼은 끝까지 지킨다','quality'],['주변과 일정·역할을 바로 조율한다','people']]],
['회의에서 가장 신경 쓰는 것은?',[['결론과 다음 행동','execute'],['논의의 흐름과 구조','plan'],['논리의 빈틈과 디테일','quality'],['사람들의 반응과 분위기','people']]],
['일이 막히면 보통 어떻게 하나요?',[['다른 방법을 바로 시도한다','execute'],['문제를 다시 쪼개본다','plan'],['원인을 끝까지 파고든다','quality'],['누군가와 이야기하며 풀어본다','people']]],
['좋은 하루였다고 느끼는 순간은?',[['많은 일을 실제로 끝냈을 때','execute'],['계획한 흐름대로 일이 진행됐을 때','plan'],['내가 만족할 만한 결과를 냈을 때','quality'],['동료들과 일이 잘 맞물렸을 때','people']]],
['피드백을 받으면 가장 먼저 드는 생각은?',[['바로 반영해보자','execute'],['어디부터 고칠지 정리하자','plan'],['더 나은 결과를 만들 수 있겠다','quality'],['상대가 왜 그렇게 느꼈을까','people']]],
['동시에 여러 일이 들어오면?',[['급한 것부터 처리한다','execute'],['우선순위를 다시 설계한다','plan'],['각 업무의 기준을 먼저 정한다','quality'],['누구와 무엇을 맞춰야 하는지 확인한다','people']]],
['내가 가장 답답해하는 상황은?',[['결정 없이 계속 이야기만 할 때','execute'],['계획이 자꾸 바뀔 때','plan'],['대충 만든 결과가 통과될 때','quality'],['정보 공유 없이 각자 움직일 때','people']]],
['새로운 아이디어가 떠오르면?',[['바로 작은 실험을 해본다','execute'],['실현 방법을 구조화한다','plan'],['더 좋은 형태가 될 때까지 다듬는다','quality'],['누구와 함께하면 좋을지 생각한다','people']]],
['업무를 마무리하기 어려운 이유는?',[['다음 일로 너무 빨리 넘어가서','execute'],['계획을 계속 수정해서','plan'],['조금만 더 고치고 싶어서','quality'],['관계자 의견을 계속 신경 써서','people']]],
['팀에서 자주 맡게 되는 역할은?',[['추진하고 실행하는 사람','execute'],['정리하고 설계하는 사람','plan'],['검토하고 완성도를 높이는 사람','quality'],['연결하고 조율하는 사람','people']]],
['지금 더 키우고 싶은 업무 습관은?',[['중요한 일을 더 빠르게 끝내기','execute'],['복잡한 일을 더 명확하게 정리하기','plan'],['힘을 덜 들이고도 좋은 결과 만들기','quality'],['내 의견과 경계를 더 분명히 표현하기','people']]]
];
let idx=0,scores={execute:0,plan:0,quality:0,people:0};
function startTest(){document.getElementById('hero').style.display='none';document.getElementById('test').style.display='block';renderQ();window.scrollTo(0,0)}
function renderQ(){document.getElementById('count').textContent=`${idx+1} / ${Q.length}`;document.getElementById('progress').style.width=`${idx/Q.length*100}%`;const [q,ops]=Q[idx];document.getElementById('questionBox').innerHTML=`<div class="question"><div class="qno">Question ${String(idx+1).padStart(2,'0')}</div><h2>${q}</h2><div class="options">${ops.map(([t,k])=>`<button class="option" onclick="answer('${k}')">${t}</button>`).join('')}</div></div>`}
function answer(k){scores[k]++;idx++;if(idx<Q.length){renderQ()}else{showResult()}}
function showResult(){document.getElementById('test').style.display='none';document.getElementById('result').style.display='block';const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const top=sorted[0][0];document.getElementById('resultTitle').textContent=types[top].name;document.getElementById('resultDesc').textContent=types[top].desc;const labels={execute:'즉시 실행',plan:'계획 설계',quality:'완성도 집중',people:'관계 조율'};document.getElementById('bars').innerHTML=sorted.map(([k,v])=>{const pct=Math.round(v/Q.length*100);return `<div class="bar-row"><div class="bar-meta"><span>${labels[k]}</span><b>${pct}%</b></div><div class="bar"><i data-w="${pct}%"></i></div></div>`}).join('');document.getElementById('actions').innerHTML=types[top].actions.map((a,i)=>`<div class="action"><div class="num">${i+1}</div><div><strong>${i===0?'오늘 바로':'이번 주 실험'}</strong><p>${a}</p></div></div>`).join('');requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(el=>el.style.width=el.dataset.w));window.scrollTo(0,0)}
function restart(){idx=0;scores={execute:0,plan:0,quality:0,people:0};document.getElementById('result').style.display='none';document.getElementById('hero').style.display='grid';window.scrollTo(0,0)}
function copyResult(){const title=document.getElementById('resultTitle').textContent;const desc=document.getElementById('resultDesc').textContent;navigator.clipboard.writeText(`KIMKIM 업무 패턴 진단\n${title}\n${desc}`).then(()=>alert('결과 요약을 복사했습니다.'))}
window.addEventListener('pointermove',e=>{document.querySelector('.orb.a').style.transform=`translate(${e.clientX*.025}px,${e.clientY*.025}px)`;document.querySelector('.orb.b').style.transform=`translate(${-e.clientX*.02}px,${-e.clientY*.02}px)`})
</script>
</body>
</html>
