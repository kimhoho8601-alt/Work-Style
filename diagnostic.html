<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KIMKIM — Work Pattern Scan</title>
<style>
:root{--bg:#f8f6ef;--paper:#fffdf8;--ink:#111;--muted:#6d6a64;--line:#cbc6ba;--lime:#dfff4f;--blue:#4d67ff;--pink:#ff7ac8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fffdf8,#eef0ff);color:var(--ink);font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.nav{height:62px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(17,17,17,.1);background:rgba(248,246,239,.9);position:sticky;top:0;z-index:10}.logo{font-size:22px;font-weight:900;letter-spacing:-.07em}.back{color:var(--ink);text-decoration:none;font-size:12px;font-weight:800}.wrap{max-width:1120px;margin:auto;padding:34px 20px 70px}.top{display:grid;grid-template-columns:120px 1fr 80px;gap:18px;align-items:center;margin-bottom:28px}.track{height:6px;background:white;border:1.5px solid var(--ink);overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--blue);transition:.25s}.counter{text-align:right;font-size:12px}.panel{min-height:72vh;display:flex;flex-direction:column;justify-content:center}.kicker{font-size:11px;letter-spacing:.16em;color:var(--blue);font-weight:900;margin-bottom:18px}.q{font-size:clamp(38px,6vw,76px);line-height:1.03;letter-spacing:-.055em;margin:0 0 34px;max-width:930px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:116px;border:1.5px solid var(--ink);border-radius:24px;background:var(--paper);padding:22px;text-align:left;cursor:pointer;box-shadow:5px 5px 0 rgba(17,17,17,.13);transition:.16s}.option:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--blue)}.option span{display:block;font-size:10px;color:var(--muted);margin-bottom:20px}.option b{font-size:17px;line-height:1.5}.result{display:none;padding-top:30px}.result h1{font-size:clamp(60px,10vw,140px);line-height:.84;letter-spacing:-.08em;margin:18px 0 28px}.result h1 small{display:block;font-size:.22em;margin-top:18px}.desc{font-size:clamp(18px,2vw,26px);line-height:1.55;max-width:820px;color:#403d39}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:42px}.card{border:1.5px solid var(--ink);border-radius:28px;padding:26px;min-height:330px;box-shadow:7px 7px 0 rgba(17,17,17,.12)}.dark{background:#111;color:#fff}.lime{background:var(--lime)}.label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;opacity:.6;margin-bottom:24px}.bar-row{margin:18px 0}.bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.bar{height:12px;background:#303030;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pink);border-radius:999px}.action{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:17px 0;border-top:1px solid rgba(17,17,17,.16)}.action:first-child{border-top:0}.action p{margin:7px 0 0;line-height:1.55}.actions{display:flex;gap:10px;margin-top:22px}.btn{border:1.5px solid var(--ink);border-radius:999px;padding:14px 18px;font-weight:900;text-decoration:none;color:#fff;background:var(--blue);cursor:pointer}.btn.alt{background:var(--paper);color:var(--ink)}@media(max-width:760px){.top{grid-template-columns:75px 1fr 55px}.options,.grid{grid-template-columns:1fr}.wrap{padding:24px 14px 50px}.actions{flex-direction:column}}
</style>
</head>
<body>
<nav class="nav"><div class="logo">KIMKIM®</div><a class="back" href="./index.html">← HOME</a></nav>
<main class="wrap">
<section id="quiz">
<div class="top"><div class="logo">SCAN</div><div class="track"><i id="progress"></i></div><div class="counter" id="count">1 / 12</div></div>
<div class="panel"><div class="kicker" id="kicker">QUESTION 01</div><h1 class="q" id="question">불러오는 중...</h1><div class="options" id="options"></div></div>
</section>
<section class="result" id="result"><div class="label">YOUR DOMINANT WORK PATTERN</div><h1 id="resultTitle"></h1><p class="desc" id="resultDesc"></p><div class="grid"><div class="card dark"><div class="label">PATTERN DISTRIBUTION</div><div id="bars"></div></div><div class="card lime"><div class="label">7-DAY MICRO ACTIONS</div><div id="actions"></div></div></div><div class="actions"><button class="btn" type="button" id="restartBtn">다시 스캔하기</button><a class="btn alt" href="./index.html">홈으로</a></div></section>
</main>
<script>
var TYPES={execute:{name:'THE MOVER',kr:'즉시 실행형',desc:'빠르게 움직이며 답을 찾는 타입입니다. 추진력과 실행 속도가 강점입니다.',actions:['시작 전에 완료 기준을 한 줄로 적기','오늘 가장 중요한 일 하나를 먼저 끝내기','초안을 빠르게 만들고 조기 공유하기']},plan:{name:'THE ARCHITECT',kr:'계획 설계형',desc:'복잡한 일을 구조와 순서로 바꾸는 타입입니다. 우선순위와 설계력이 강점입니다.',actions:['계획은 20분 안에 끝내고 초안 시작하기','하지 않을 일 하나 먼저 정하기','완성도 60%에서 중간 공유하기']},quality:{name:'THE CRAFTER',kr:'완성도 집중형',desc:'기준과 디테일을 놓치지 않는 타입입니다. 결과물의 품질을 높이는 힘이 강점입니다.',actions:['업무마다 완성도 등급 정하기','수정 횟수 최대 2회로 제한하기','충분히 잘한 일 하나 기록하기']},people:{name:'THE CONNECTOR',kr:'관계 조율형',desc:'사람과 흐름을 연결하는 타입입니다. 협업의 맥락과 관계를 읽는 힘이 강점입니다.',actions:['요청에 답하기 전 내 우선순위 확인하기','회의 초반에 내 의견 한 번 말하기','도움을 주기 전 오늘의 핵심 업무 확인하기']}};
var Q=[['새 업무가 도착했습니다. 첫 반응은?',[['일단 손부터 대고 흐름을 만든다','execute'],['전체 구조와 순서를 먼저 그린다','plan'],['좋은 결과의 기준부터 확인한다','quality'],['누가 무엇을 기대하는지 먼저 본다','people']]],['마감이 갑자기 당겨졌습니다. 나는?',[['빠르게 초안을 만들고 수정한다','execute'],['남은 시간을 다시 쪼개 계획한다','plan'],['핵심 품질은 끝까지 지킨다','quality'],['관련자들과 역할과 일정을 바로 맞춘다','people']]],['회의 중 가장 먼저 보이는 것은?',[['결론과 다음 액션','execute'],['논의의 구조와 흐름','plan'],['논리의 빈틈과 디테일','quality'],['사람들의 반응과 분위기','people']]],['일이 막히는 순간, 나는?',[['다른 방법을 바로 시도한다','execute'],['문제를 다시 쪼개서 본다','plan'],['원인을 끝까지 파고든다','quality'],['누군가와 대화하며 풀어본다','people']]],['오늘 일 잘했다는 느낌은 언제 오나요?',[['많은 일을 실제로 끝냈을 때','execute'],['계획한 흐름대로 진행됐을 때','plan'],['내 기준에 맞는 결과가 나왔을 때','quality'],['동료들과 일이 잘 맞물렸을 때','people']]],['피드백을 받으면 가장 먼저?',[['바로 반영해본다','execute'],['수정 순서를 정리한다','plan'],['어떻게 더 좋아질지 본다','quality'],['왜 그렇게 느꼈는지 생각한다','people']]],['일이 한꺼번에 몰리면?',[['급한 것부터 빠르게 친다','execute'],['우선순위를 다시 설계한다','plan'],['각 업무의 기준부터 정한다','quality'],['누구와 무엇을 맞출지 확인한다','people']]],['가장 답답한 업무 상황은?',[['결정 없이 말만 길어질 때','execute'],['계획이 계속 바뀔 때','plan'],['대충 만든 결과가 통과될 때','quality'],['정보 공유 없이 각자 움직일 때','people']]],['새 아이디어가 생기면?',[['바로 작은 실험을 해본다','execute'],['실현 방법을 구조화한다','plan'],['더 좋은 형태가 될 때까지 다듬는다','quality'],['누구와 같이 하면 좋을지 생각한다','people']]],['마무리가 어려워지는 이유는?',[['다음 일로 너무 빨리 넘어가서','execute'],['계획을 계속 수정해서','plan'],['조금만 더 고치고 싶어서','quality'],['관계자 의견을 계속 신경 써서','people']]],['팀에서 자연스럽게 맡는 역할은?',[['밀고 나가는 사람','execute'],['정리하고 설계하는 사람','plan'],['검토하고 완성도를 높이는 사람','quality'],['연결하고 조율하는 사람','people']]],['지금 가장 키우고 싶은 업무 습관은?',[['중요한 일을 더 빠르게 끝내기','execute'],['복잡한 일을 더 명확히 정리하기','plan'],['힘을 덜 들이고도 좋은 결과 만들기','quality'],['내 의견과 경계를 더 분명히 말하기','people']]];
var idx=0;var scores={execute:0,plan:0,quality:0,people:0};
function byId(id){return document.getElementById(id);}
function render(){var item=Q[idx];byId('count').textContent=(idx+1)+' / '+Q.length;byId('kicker').textContent='QUESTION '+('0'+(idx+1)).slice(-2);byId('progress').style.width=Math.round(idx/Q.length*100)+'%';byId('question').textContent=item[0];var box=byId('options');box.innerHTML='';for(var i=0;i<item[1].length;i++){var op=item[1][i];var b=document.createElement('button');b.type='button';b.className='option';b.setAttribute('data-key',op[1]);b.innerHTML='<span>0'+(i+1)+'</span><b></b>';b.getElementsByTagName('b')[0].textContent=op[0];b.onclick=function(){choose(this.getAttribute('data-key'));};box.appendChild(b);}}
function choose(key){scores[key]+=1;idx+=1;if(idx<Q.length){render();}else{showResult();}}
function showResult(){byId('quiz').style.display='none';byId('result').style.display='block';var keys=['execute','plan','quality','people'];keys.sort(function(a,b){return scores[b]-scores[a];});var top=keys[0];byId('resultTitle').innerHTML=TYPES[top].name+'<small>'+TYPES[top].kr+'</small>';byId('resultDesc').textContent=TYPES[top].desc;var labels={execute:'MOVE',plan:'STRUCTURE',quality:'CRAFT',people:'CONNECT'};var bars='';for(var i=0;i<keys.length;i++){var p=Math.round(scores[keys[i]]/Q.length*100);bars+='<div class="bar-row"><div class="bar-head"><span>'+labels[keys[i]]+'</span><strong>'+p+'%</strong></div><div class="bar"><i style="width:'+p+'%"></i></div></div>';}byId('bars').innerHTML=bars;var acts='';for(var j=0;j<TYPES[top].actions.length;j++){acts+='<div class="action"><span>0'+(j+1)+'</span><div><strong>'+(j===0?'TODAY':'THIS WEEK')+'</strong><p>'+TYPES[top].actions[j]+'</p></div></div>';}byId('actions').innerHTML=acts;window.scrollTo(0,0);}
function restart(){idx=0;scores={execute:0,plan:0,quality:0,people:0};byId('result').style.display='none';byId('quiz').style.display='block';render();window.scrollTo(0,0);}
byId('restartBtn').onclick=restart;
render();
</script>
</body>
</html>
