name: Replace hero with exact source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/assemble-hero.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact uploaded interview MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/video
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://sck-my.sharepoint.com/:v:/g/personal/hongseop_kim_sc_or_kr/IQCNdomjMTaDRqkKSqEK2yumAS8Qwxb7Z8cYMnsYEpDI0nk?download=1' \
            -o assets/video/hero.mp4

      - name: Verify exact source bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('assets/video/hero.mp4')
          data=p.read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          print('hero bytes:', len(data))
          print('hero sha256:', digest)
          assert len(data) == 1491887, len(data)
          assert digest == '94af22bd16467e11ed85794917dc3857a3c10f871622501705e781099e522c11', digest
          assert b'ftyp' in data[:32]
          PY

      - name: Bump homepage video cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./assets/video/hero.mp4?v=20260825-final','./assets/video/hero.mp4?v=20260825-original720')
          s=s.replace('aria-label="사무실 인터뷰 장면"','aria-label="빨간 조끼를 입은 직원의 사무실 인터뷰 장면"')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit exact source and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/assemble-hero.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use exact final interview video as homepage hero'
          git push origin HEAD:main
